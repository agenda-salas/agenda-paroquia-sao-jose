<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="raiz" content=".">
<title>Entrar · Sistema de Reservas</title>
<meta name="theme-color" content="#40623F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=29">
</head>
<body>
<main class="pagina">
  <div class="estreito cartao form">
    <div id="msg" class="aviso" hidden role="status"></div>

    <form id="f-entrar" class="form">
      <h1 style="font-size:24px">Entrar</h1>
      <p class="nota" style="margin:0">Use o login e a senha da sua pastoral, grupo ou movimento, fornecidos pela secretaria paroquial à coordenação. Dúvidas: secretaria paroquial (61) 3354-2921.</p>
      <label class="campo">E-mail
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <label class="campo">Senha
        <input type="password" name="senha" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn btn-grande">Entrar</button>
      <button type="button" class="btn btn-sec" id="esqueci">Esqueci minha senha</button>
      <p class="nota" style="margin:0">Não paroquiano não precisa de login: volte ao início e escolha "Não sou Paroquiano".</p>
    </form>

    <form id="f-nova" class="form" hidden>
      <h1 style="font-size:24px">Nova senha</h1>
      <label class="campo">Nova senha (mínimo de 6 caracteres)
        <input type="password" name="senha" autocomplete="new-password" minlength="6" required>
      </label>
      <label class="campo">Repita a nova senha
        <input type="password" name="confirma" autocomplete="new-password" minlength="6" required>
      </label>
      <button type="submit" class="btn btn-grande">Salvar senha</button>
    </form>
  </div>
</main>
<script type="module" src="js/paginas/entrar.js"></script>
</body>
</html>
